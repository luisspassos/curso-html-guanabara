<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
        }
       #q1 {
        width: 100vw;
        height: 100vh;
        background: url(https://img.freepik.com/fotos-gratis/3d-rendem-de-uma-mesa-de-madeira-com-uma-imagem-defocussed-de-um-barco-em-um-lago_1048-3432.jpg?size=626&ext=jpg) center center/100px 100px repeat-y;
       }

       #q2 {
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        background: url(https://img.freepik.com/fotos-gratis/3d-rendem-de-uma-mesa-de-madeira-com-uma-imagem-defocussed-de-um-barco-em-um-lago_1048-3432.jpg?size=626&ext=jpg) center center/100px 100px repeat-x;
       }
    </style>
</head>
<body>
    <div id="q1"></div>
    <div id="q2"></div>
</body>
</html>
