<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo elementos</title>
    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        li {
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: brown;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active {
            color: cyan;
        }

        a:visited {
            color: chartreuse;
        }

        .especial {
            background-color: salmon;
        }

        .especial::before {
            content: '<3';
        }

        .especial::after {
            content: '<3';
        }
        
    </style>
</head>
<body>
    <h1>Pseudo-Elementos</h1>
    <ul>
        <li><a class="especial" href="https://www.youtube.com/watch?v=rUTKomc2gG8">Canal do YouTube</a></li>
        <li><a href="https://www.youtube.com/watch?v=rUTKomc2gG8">Canal da Twitch</a></li>
        <li><a href="https://www.youtuasdasdsde.com/watch?v=rUTKomc2gG8">Twitter</a></li>
    </ul>
</body>
</html>
