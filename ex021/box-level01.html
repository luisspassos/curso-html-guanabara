<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Level</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        /* Lembrar do relógio para boxes >< */
        h1 {
            background-color: rgba(128, 128, 128, 0.795);
            width: 300px;
            height: 300px;
            border: 10px solid rgb(102, 47, 255);
            padding: 10px 10px 10px 10px;
            margin: 10px auto;
            outline: 2px darkmagenta dashed;

            }

        span {
            background-color: rgb(216, 216, 185);
            border: 5px solid lightcoral;
            padding: 10px 10px 10px 10px;
            display: block;
            width: 300px;
            margin: 5px auto;
            outline: 2px dashed darkmagenta;
        }

        p {
            text-align: center;
            text-indent: 10px;
        }
    </style>
</head>
<body>
    <!-- # para link de teste-->
    <h1>Estudando caixas box-level</h1>
    <p>Exemplo de <span>span</span> para treino.</p>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Obcaecati facilis molestiae voluptates at dicta odit iure, fuga fugiat ea quibusdam animi? Ipsum vel architecto possimus voluptates autem totam doloremque quaerat!</p>
</body>
</html>
