<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        body {
            background-color: rgb(187, 190, 189);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0px;
        }

        header {
            background-color: linen;
            padding: 10px;
            margin: 10px 10px 20px 10px;
            border: 2px solid rgb(77, 76, 76);
        }


        main {
            background-color: linen;
            padding: 5px;
            margin: 10px 10px 20px 10px;
            border: 2px solid rgb(77, 76, 76);

        }

        main > article {
            background-color: rgb(241, 223, 223);
            border: 2px solid rgb(117, 115, 115);
            margin: 5px;
            border-radius: 7px 7px 0px 0px;
            box-shadow: 2px 2px 4px 1px rgba(0, 0, 0, 0.377);

        }

        footer {
            background-color: gray;
            border-top: 2px solid rgb(77, 76, 76);
            border-bottom: 2px solid rgb(77, 76, 76);
            text-align: center;
            padding: 10px;
            margin: 0px;
        }

        nav {
            background-color: rgb(155, 151, 151);
            padding: 2px;
            border: 2px solid rgb(77, 76, 76);
            box-shadow: 2px 2px 4px 1px rgba(0, 0, 0, 0.377);
        }

        nav > a {
            color: rgb(49, 49, 49);
            text-decoration: none;
            margin-right: 20px;
        }

        nav > a:hover {
            text-decoration: underline;
            color: rgb(49, 49, 49);
        }

        hr {
            border: 1px rgb(117, 115, 115) solid;
        }

        aside > h1 {
            padding-left: 10px;
            color: rgb(77, 76, 76);
        }
        
        footer > p{
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
        <nav>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
        </nav>

    </header>
    <main>
        <h1>Notícias</h1>
        
        <article>
            <aside>
                <h1>Política</h1>
                <ul type="square">
                    <li>Notícias</li>
                    <li>Notícias</li>
                    <li>Notícias</li>
                    <li>Notícias</li>
                </ul>
            </aside>
            <hr>
            <aside>
                <h1>Esportes</h1>
                <ul type="square">
                    <li>Notícias</li>
                    <li>Notícias</li>
                    <li>Notícias</li>
                    <li>Notícias</li>
                </ul>
            </aside>
        </article>
    </main>
    <footer>
        <p>Desenvolvido por Luís</p>
    </footer>
</body>
</html>
